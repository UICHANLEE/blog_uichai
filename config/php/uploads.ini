expose_php = Off
display_errors = Off
log_errors = On
file_uploads = On
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000
session.cookie_httponly = 1
session.cookie_samesite = Lax
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
